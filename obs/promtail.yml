server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: "speechagent"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: ".*(loki|promtail|log-collector|log-janitor).*"
        action: drop
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{compose_project="speechagent"} |~ "SA_TRACE "'
          stages:
            - regex:
                expression: 'SA_TRACE (?P<sa_trace>\{.+\})'
            - json:
                expressions:
                  agent: agent
                  event: event
                  trace_id: trace_id
                  session_id: session_id
                  seq: seq
                  level: level
                source: sa_trace
            - labels:
                agent:
                event:
            - structured_metadata:
                seq:
                level:
                trace_id:
                session_id:
