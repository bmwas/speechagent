# MiniCPM-o 4.5 native duplex on one Ada GPU (cuda:0).
# Mirrors upstream vllm-omni v0.30.0 vllm_omni/deploy/minicpmo_4_5.yaml
# (duplex is now the default; minicpmo_4_5_turn.yaml selects turn mode).
# Only single-GPU memory tuning is changed vs upstream:
#   max_sessions/max_num_seqs 1, eager, stage0 0.55 + 4 GiB KV,
#   stage1 0.15 + 2 GiB KV, stage2 0.18, cuda_mps false.
pipeline: minicpmo_4_5
async_chunk: true
session_mode: duplex
duplex_session:
  # Matches Stage 0/1 max_num_seqs below (one live session on this card).
  max_sessions: 1

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      # HiFT capture buckets are derived from codec_chunk_frames and
      # codec_left_context_frames. (#5869)
      enable_hift_graph: true
      enable_cfm_graph: true
      cfm_max_graphs: 32
      cfm_graph_bucket_frames: 16

stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.55
    kv_cache_memory_bytes: 4294967296
    enforce_eager: true
    # 4096 overflowed at ~4167 tokens (~2 min of 100 ms PCM + 1 JPEG/s).
    # 8192 leaves sampling room; the agent still opens with
    # sliding_window_mode=basic (trim 3000 / resume 2000) so the thinker
    # never grows to this cap. Talker (stage 1) stays 4096.
    max_model_len: 8192
    max_num_batched_tokens: 8192
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        # Upstream ships 128; 128 frames cannot fit the Ada stage-0 window.
        num_frames: 16
    limit_mm_per_prompt:
      # Upstream ships image/audio 64; trimmed so live 1 FPS stills fit the window.
      image: 8
      audio: 8
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

  - stage_id: 1
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    kv_cache_memory_bytes: 2147483648
    enforce_eager: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    output_connectors:
      to_stage_2: connector_of_shared_memory
    # Talker is a single-vocab codec LM. These knobs go to vLLM's Sampler
    # (head_code logits). EOS is tts_config.eos_token_id.
    default_sampling_params:
      temperature: 0.8
      top_p: 0.85
      top_k: 25
      repetition_penalty: 1.05
      min_tokens: 50
      max_tokens: 4096
      seed: 42
      detokenize: false

  - stage_id: 2
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.18
    enforce_eager: true
    enable_chunked_prefill: false
    # Upstream ships 65536; trim so the vocoder KV fits beside Thinker+Talker.
    max_model_len: 16384
    max_num_batched_tokens: 16384
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 16384
      detokenize: true

platforms:
  cuda:
    cuda_mps: false
    stages:
      - stage_id: 0
        kv_cache_memory_bytes: 4294967296
        gpu_memory_utilization: 0.55
        enforce_eager: true
      - stage_id: 1
        kv_cache_memory_bytes: 2147483648
        gpu_memory_utilization: 0.15
        enforce_eager: true
      - stage_id: 2
        gpu_memory_utilization: 0.18
        enforce_eager: true
