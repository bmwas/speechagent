# MiniCPM-o 4.5 native duplex on one Ada GPU (cuda:0).
# Mirrors upstream vllm-omni v0.30.0 vllm_omni/deploy/minicpmo_4_5.yaml
# (duplex is now the default; minicpmo_4_5_turn.yaml selects turn mode).
# Single-GPU memory tuning vs upstream:
#   max_sessions/max_num_seqs 1, stage0 0.55 + 4 GiB KV,
#   stage1 0.15 + 2 GiB KV, stage2 0.18, cuda_mps false.
# CUDA graphs match the upstream 1-GPU recipe (Ada is dedicated):
#   Thinker + Talker enforce_eager false, Code2Wav runner stays eager.
# Inner HiFT/CFM graphs below are independent of that runner flag.
# Pinned KV skips vLLM's CUDA-graph memory estimate. If load OOMs,
# drop stage-0 kv_cache_memory_bytes 4 GiB → 3 GiB (sliding window
# is 3000 tokens; 4 GiB is far more than one session needs).
pipeline: minicpmo_4_5
async_chunk: true
session_mode: duplex
duplex_session:
  # Matches Stage 0/1 max_num_seqs below (one live session on this card).
  max_sessions: 1

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # 24 codec frames become the upstream predefined 48-frame DiT/HiFT
      # graph shape. The previous 25-frame chunks created new graph shapes
      # during live turns and blocked Code2Wav for several seconds.
      codec_chunk_frames: 24
      codec_left_context_frames: 3
      # HiFT capture buckets are derived from codec_chunk_frames and
      # codec_left_context_frames. (#5869). Body chunks hit 48/56; entrypoint
      # also warms even 10-56 so first/last chunks are not recaptured live.
      enable_hift_graph: true
      enable_cfm_graph: true
      cfm_max_graphs: 32
      cfm_graph_bucket_frames: 16

stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.55
    kv_cache_memory_bytes: 4294967296
    # Decode graphs on. max_num_seqs 1 keeps capture sizes tiny.
    enforce_eager: false
    # Extra async frames after a chunk terminator desync the Talker
    # hidden-state ledger (missing own-token hidden states).
    async_scheduling: false
    # 4096 overflowed at ~4167 tokens (~2 min of 100 ms PCM + 1 JPEG/s).
    # 8192 leaves sampling room; the agent still opens with
    # sliding_window_mode=basic (trim 3000 / resume 2000) so the thinker
    # never grows to this cap. Talker (stage 1) stays 4096.
    max_model_len: 8192
    max_num_batched_tokens: 8192
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        # Upstream ships 128; 128 frames cannot fit the Ada stage-0 window.
        num_frames: 16
    limit_mm_per_prompt:
      # Upstream ships image/audio 64; trimmed so live 1 FPS stills fit the window.
      image: 8
      audio: 8
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

  - stage_id: 1
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    kv_cache_memory_bytes: 2147483648
    enforce_eager: false
    async_scheduling: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    output_connectors:
      to_stage_2: connector_of_shared_memory
    # Talker is a single-vocab codec LM. These knobs go to vLLM's Sampler
    # (head_code logits). EOS is tts_config.eos_token_id.
    default_sampling_params:
      temperature: 0.8
      top_p: 0.85
      top_k: 25
      repetition_penalty: 1.05
      min_tokens: 50
      max_tokens: 4096
      seed: 42
      detokenize: false

  - stage_id: 2
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.18
    # Runner stays eager: request-owned Flow/HiFT caches are not valid
    # outer-graph inputs. Vocoder speed is enable_hift_graph / enable_cfm_graph.
    enforce_eager: true
    enable_chunked_prefill: false
    # Upstream ships 65536; trim so the vocoder KV fits beside Thinker+Talker.
    max_model_len: 16384
    max_num_batched_tokens: 16384
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 16384
      detokenize: true

platforms:
  cuda:
    cuda_mps: false
    stages:
      - stage_id: 0
        kv_cache_memory_bytes: 4294967296
        gpu_memory_utilization: 0.55
        enforce_eager: false
        async_scheduling: false
      - stage_id: 1
        kv_cache_memory_bytes: 2147483648
        gpu_memory_utilization: 0.15
        enforce_eager: false
        async_scheduling: false
      - stage_id: 2
        gpu_memory_utilization: 0.18
        enforce_eager: true
