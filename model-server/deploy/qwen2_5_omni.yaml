# Qwen2.5-Omni-3B turn-based. Official recipe puts talker on devices:"1";
# this container only has Ada as cuda:0, so all three stages colocate there.
# 8192 context is required for a live /v1/video/chat/stream window
# (~40 frames at 448px + mic PCM). 2048 cannot hold that query.
# If load OOMs, drop to 4096 and cut QWEN_VIDEO_NUM_FRAMES.
async_chunk: false
trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.40
    kv_cache_memory_bytes: 2147483648
    enforce_eager: true
    mm_processor_cache_gb: 0
    default_sampling_params:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 512
      detokenize: true

  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.20
    kv_cache_memory_bytes: 1073741824
    enforce_eager: true
    default_sampling_params:
      temperature: 0.9
      top_p: 0.8
      top_k: 40
      max_tokens: 512
      detokenize: false

  - stage_id: 2
    devices: "0"
    max_num_seqs: 1
    gpu_memory_utilization: 0.12
    enforce_eager: true
    enable_flashinfer_autotune: false
    async_scheduling: false
    default_sampling_params:
      temperature: 0.0
      max_tokens: 512
      detokenize: true

platforms:
  cuda:
    cuda_mps: false
    stages:
      - stage_id: 0
        kv_cache_memory_bytes: 2147483648
        gpu_memory_utilization: 0.40
        enforce_eager: true
      - stage_id: 1
        kv_cache_memory_bytes: 1073741824
        gpu_memory_utilization: 0.20
        enforce_eager: true
      - stage_id: 2
        gpu_memory_utilization: 0.12
        enforce_eager: true
